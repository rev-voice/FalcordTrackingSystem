<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Falcord Tracking System - Accesso Cliente</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a4a4a;
      --primary-dark: #2d2d2d;
      --accent: #FFD700;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-dark: #2d2d2d;
      --bg-card: #3a3a3a;
      --text-primary: #f5f5f5;
      --text-secondary: #b0b0b0;
      --border: #555555;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a1a 100%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1800px; margin: 0 auto; }

    /* Header & Footer */
    header {
      text-align: center;
      padding: 24px 20px 32px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 24px;
      background: var(--primary-dark);
      border-radius: var(--radius);
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-secondary);
      margin-top: 40px;
      border-top: 1px solid var(--border);
    }

    /* Login Form Styles */
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 24px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-dark);
      color: var(--text-primary);
      font-size: 1.2rem;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 8px;
      text-transform: uppercase;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-input::placeholder {
      letter-spacing: 2px;
      color: var(--text-secondary);
    }

    .login-btn {
      width: 100%;
      padding: 14px 24px;
      background: var(--accent);
      color: var(--primary-dark);
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .login-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-top: 16px;
      color: var(--danger);
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
      margin: 20px 0;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 1000px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      word-wrap: break-word;
      word-break: break-word;
      max-width: 200px;
      vertical-align: middle;
      line-height: 1.4;
    }

    th {
      background: var(--primary);
      color: var(--text-primary);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid var(--accent);
    }

    tbody tr:hover td { background: transparent; }

    .column-highlight {
      background: rgba(255, 215, 0, 0.15) !important;
      border-left: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
    }

    .uuid-header {
      font-family: 'Courier New', monospace;
      color: var(--accent);
      font-size: 0.75rem;
      background: rgba(255, 215, 0, 0.1);
      padding: 6px 10px;
      border-radius: 4px;
      display: inline-block;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .uuid-header:hover {
      background: rgba(255, 215, 0, 0.2);
      border-color: var(--accent);
    }
    .uuid-header.active {
      background: rgba(255, 215, 0, 0.3);
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    /* First column - WIDER to avoid overlap */
    .field-name {
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      background: var(--primary-dark);
      padding: 6px 10px;
      border-radius: 4px;
      display: block;
      line-height: 1.3;
      width: 180px;
      min-width: 180px;
      max-width: 180px;
    }

    .field-name.multiline {
      white-space: normal;
      width: 200px;
      min-width: 200px;
      max-width: 200px;
    }

    /* Force first column width */
    #tableBody tr td:first-child,
    #tableHead tr th:first-child {
      width: 180px !important;
      min-width: 180px !important;
      max-width: 180px !important;
    }

    .empty-value { color: var(--text-secondary); font-style: italic; }
    
    .note-cell {
      max-width: 200px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: block;
      line-height: 1.3;
    }
    
    .yacht-badge {
      background: rgba(255, 215, 0, 0.15);
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 500;
      color: var(--accent);
      display: inline-block;
    }

    .gassa-value {
      font-weight: 500;
      color: var(--text-primary);
    }

    .scans-panel {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 2px solid var(--accent);
      padding: 20px;
      margin-top: 24px;
      display: none;
    }

    .scans-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .scans-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .close-btn {
      background: var(--primary);
      border: none;
      color: var(--text-primary);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 6px;
    }
    .close-btn:hover { background: var(--danger); }

    .scan-item {
      background: var(--bg-dark);
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      margin-bottom: 8px;
    }

    .scan-time {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .scan-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Utility */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-24 { margin-top: 24px; }

    @media (max-width: 768px) {
      h1 { font-size: 1.4rem; }
      .logo-img { width: 50px; height: 50px; }
      th, td { padding: 10px 12px; font-size: 0.8rem; }
      .login-card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <img src="falcord_logo_500.png" alt="Falcord Logo" class="logo-img" />
        <div>
          <h1>Falcord Tracking System</h1>
          <p class="subtitle">Gestione digitale del ciclo di vita</p>
        </div>
      </div>
    </header>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="login-container">
      <div class="login-card">
        <div class="login-title">🔐 Accesso Cliente</div>
        <p class="login-subtitle">Inserisci il tuo PIN a 4 caratteri per visualizzare le corde associate al tuo yacht.</p>
        
        <form id="pinForm">
          <div class="form-group">
            <label class="form-label" for="pinInput">PIN</label>
            <input 
              type="text" 
              id="pinInput" 
              class="form-input" 
              placeholder="••••" 
              maxlength="4" 
              pattern="[A-Za-z0-9]{4}"
              autocomplete="off"
              required
            />
          </div>
          <button type="submit" id="loginBtn" class="login-btn">
            Accedi
          </button>
        </form>
        
        <div id="loginError" class="error-message">
          ❌ PIN non valido. Controlla e riprova.
        </div>
      </div>
    </div>

    <!-- LOADING -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Caricamento dati...</p>
    </div>

    <!-- GLOBAL ERROR (Strictly Hidden by default) -->
    <div id="error" class="error-box hidden" style="display: none;"></div>

    <!-- PRODUCTS SECTION (hidden until login) -->
    <div id="productsSection" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin: 24px 0 16px;">
        <h2 style="color: var(--accent); font-size: 1.3rem; margin: 0;">📦 Le tue Corde</h2>
        <button id="logoutBtn" style="background: var(--primary); color: var(--text-primary); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">🚪 Esci</button>
      </div>
      
      <div id="yachtInfo" style="display: none;"></div>
      
      <div class="table-container">
        <table id="productsTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div id="scansPanel" class="scans-panel">
        <div class="scans-header">
          <div>
            <div class="scans-title">🔍 Storico Scansioni</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px;" id="scansUuid"></div>
          </div>
          <button class="close-btn" id="closeScansBtn">×</button>
        </div>
        <div id="scansList"></div>
      </div>
    </div>

    <footer>
      <p style="margin-top: 8px;">© 2026 Falcord S.r.l.</p>
    </footer>
  </div>

  <script>
    (function() {
      'use strict';

      const CONFIG = {
        DB_URL: 'https://exshynvdaacktlbwfqrq.supabase.co',
        DB_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4c2h5bnZkYWFja3RsYndmcXJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODI4MDcsImV4cCI6MjA4OTI1ODgwN30.KOGEWBVqh_JGOlb-lhhVM2mcFmmIMToCGbFk6s0cE-c'
      };

      const PRODUCT_MAP = {
        1: "Mayorca", 2: "Capri", 3: "Mega Yacht", 4: "Megayacht SK",
        5: "Tornado", 6: "Skipper", 7: "Tornado PPL", 8: "Trefil",
        9: "Trefil HT", 10: "Trefil M", 11: "Liberty Oblix", 12: "Liberty SK", 13: "T16"
      };

      const CALZA_MAP = {
        1: "Poliestere", 2: "Nylon", 3: "Oblix", 4: "Dyneema SK78", 5: "Nessuna - treccia singola"
      };

      const ANIMA_MAP = {
        1: "Poliestere", 2: "Nylon", 3: "Dyneema SK78", 4: "HMWPE Oblix", 5: "Nessuna - treccia singola"
      };

      const COLORE_MAP = {
        1: "Nera", 2: "Blu Navy", 3: "Grigio", 4: "Nero Antracite", 5: "Bianca",
        6: "Bordeaux", 7: "Gialla", 8: "Arancio", 9: "Rosso", 10: "Azzurro"
      };

      const UV_MAP = {
        1: "Scarsa", 2: "Media", 3: "Buona", 4: "Molto Buona", 5: "Ottima", 6: "Eccellente"
      };

      const TRATTAMENTO_MAP = {
        1: "Anima Interna Coating", 2: "Treccia Singola Coating", 3: "Senza Anima", 4: "Senza Trattamento"
      };

      const GALLEGG_MAP = {
        1: "Affondante", 2: "Galleggiante", 3: "Semi Galleggiante"
      };

      let dbClient = null;
      let selectedColumnIndex = -1;
      let currentPin = null;
      let yachtName = null;

      function initDB() {
        if (dbClient) return dbClient;
        try {
          dbClient = window.supabase.createClient(CONFIG.DB_URL, CONFIG.DB_KEY);
          return dbClient;
        } catch (error) {
          console.error('✗ Database initialization failed:', error);
          throw error;
        }
      }

      function calculateStatus(prodDateInt, coreCode) {
        const prodYear = Math.floor(prodDateInt / 10000);
        const prodMonth = Math.floor((prodDateInt % 10000) / 100);
        const prodDate = new Date(prodYear, prodMonth - 1, 1);
        const today = new Date();
        
        const ageYears = (today - prodDate) / (1000 * 60 * 60 * 24 * 365.25);
        let lifespan = 5.0;
        
        if ([3, 4].includes(coreCode)) lifespan += 2.0;
        
        if (ageYears < lifespan - 2) return { label: "OK", class: "status-ok" };
        if (ageYears < lifespan) return { label: "Attenzione", class: "status-warning" };
        return { label: "Pericolo", class: "status-danger" };
      }

      function formatValue(product, field) {
        let value = product[field.key];
        
        if (value === null || value === undefined) return '-';
        
        if (field.key === 'gassa') {
          const gassaVal = parseInt(value);
          if (isNaN(gassaVal) || gassaVal === 0) return 'Nessuna';
          return `<span class="gassa-value">${gassaVal} cm</span>`;
        }
        
        if (field.map) {
          value = field.map[value] || value;
        }
        
        if (field.format === 'number' && value) {
          // FIX 3: Remove thousands separator - just show raw number
          value = Number(value).toString();
        }
        
        if (field.suffix && value !== '-') {
          value += field.suffix;
        }
        
        return value;
      }

      function highlightColumn(columnIndex) {
        document.querySelectorAll('.column-highlight').forEach(el => el.classList.remove('column-highlight'));
        document.querySelectorAll('.uuid-header.active').forEach(el => el.classList.remove('active'));

        if (columnIndex === -1) {
          selectedColumnIndex = -1;
          return;
        }

        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
          const cells = row.querySelectorAll('td');
          if (cells[columnIndex + 1]) {
            cells[columnIndex + 1].classList.add('column-highlight');
          }
        });

        const headers = document.querySelectorAll('#tableHead th');
        if (headers[columnIndex + 1]) {
          const uuidHeader = headers[columnIndex + 1].querySelector('.uuid-header');
          if (uuidHeader) uuidHeader.classList.add('active');
        }

        selectedColumnIndex = columnIndex;
      }

      function renderTable(products) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        
        if (!products || products.length === 0) {
          tbody.innerHTML = '<tr><td colspan="100" style="text-align:center;padding:40px;color:var(--text-secondary);">Nessuna corda trovata per questo yacht</td></tr>';
          thead.innerHTML = '';
          return;
        }

        const fields = [
          { key: 'prodotto', label: 'Prodotto', map: PRODUCT_MAP },
          { key: 'diametro', label: 'Diametro', suffix: ' mm' },
          { key: 'lunghezza', label: 'Lunghezza', suffix: ' m' },
          { key: 'calza', label: 'Calza', map: CALZA_MAP },
          { key: 'anima', label: 'Anima', map: ANIMA_MAP },
          { key: 'gassa', label: 'Gassa' },
          { 
            key: 'carico_rottura', 
            label: 'Carico Rottura (Falcord)<br><span style="font-size:0.75rem;color:var(--text-secondary);font-weight:400;">Coeff.Sicurezza di lavoro 7:1</span>', 
            suffix: ' kg', 
            format: 'number',
            multiline: true
          },
          { key: 'colore', label: 'Colore', map: COLORE_MAP },
          { key: 'uv_resistance', label: 'Res. UV', map: UV_MAP },
          { key: 'trattamento', label: 'Trattamento', map: TRATTAMENTO_MAP },
          { key: 'galleggiabilita', label: 'Galleggiabilità', map: GALLEGG_MAP },
          { key: 'data_produzione', label: 'Data Prod.' },
          { key: 'pin', label: 'Yacht', isYacht: true },
          { key: 'note', label: 'Note', isNote: true },
          { key: 'stato', label: 'Stato', isStatus: true }
        ];

        let headHTML = '<tr><th style="min-width: 120px;">Campo</th>';
        products.forEach((p, idx) => {
          headHTML += `<th><span class="uuid-header" data-idx="${idx}" data-uuid="${p.nfc_uuid}">${p.nfc_uuid}</span></th>`;
        });
        headHTML += '</tr>';
        thead.innerHTML = headHTML;

        document.querySelectorAll('.uuid-header').forEach(header => {
          header.addEventListener('click', () => {
            const idx = parseInt(header.dataset.idx);
            const uuid = header.dataset.uuid;
            highlightColumn(idx);
            loadScans(uuid);
          });
        });

        let bodyHTML = '';
        fields.forEach(field => {
          const multilineClass = field.multiline ? 'multiline' : '';
          bodyHTML += `<tr><td><span class="field-name ${multilineClass}">${field.label}</span></td>`;
          
          products.forEach(product => {
            let cellContent = '';
            
            if (field.isStatus) {
              const status = calculateStatus(product.data_produzione, product.anima);
              cellContent = `<span class="status-badge ${status.class}">${status.label}</span>`;
            } else if (field.isYacht) {
              const yachtPin = product.pin || '';
              cellContent = yachtPin ? `<span class="yacht-badge">${yachtName || yachtPin}</span>` : '<span class="empty-value">-</span>';
            } else if (field.isNote) {
              const noteText = product.note || '';
              const displayNote = noteText === '' ? '<span class="empty-value">-</span>' : noteText;
              cellContent = `<span class="note-cell">${displayNote}</span>`;
            } else if (field.key === 'data_produzione') {
              const prodDate = product.data_produzione?.toString() || "20230101";
              cellContent = `${prodDate.substring(0, 4)}-${prodDate.substring(4, 6)}`;
            } else {
              const value = formatValue(product, field);
              const displayValue = value === '-' ? '<span class="empty-value">-</span>' : value;
              cellContent = displayValue;
            }
            
            bodyHTML += `<td>${cellContent}</td>`;
          });
          
          bodyHTML += '</tr>';
        });
        
        tbody.innerHTML = bodyHTML;
      }

      async function loadProductsForPin(pin) {
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const productsSectionEl = document.getElementById('productsSection');
        const yachtInfoEl = document.getElementById('yachtInfo');

        try {
          const db = initDB();

          const {  yachtData, error: yachtError } = await db
            .from('yacht')
            .select('yacht_id, nome_yacht')
            .eq('yacht_id', pin)
            .single();

          if (yachtError || !yachtData) {
            throw new Error('PIN non trovato');
          }

          yachtName = yachtData.nome_yacht || pin;
          // FIX 1: Removed yacht info display
          // yachtInfoEl.textContent = `🛥️ Yacht: ${yachtName} • PIN: ${pin}`;

          // Now load products for this PIN
          const { data, error } = await db
            .from('products')
            .select('*')
            .eq('pin', pin)
            .order('data_creazione', { ascending: false });

          if (error) throw error;

          renderTable(data || []);

          loadingEl.classList.add('hidden');
          productsSectionEl.classList.remove('hidden');

        } catch (err) {
          console.error('Error:', err);
          loadingEl.classList.add('hidden');
          throw err;
        }
      }

      async function loadScans(tagUuid) {
        const panel = document.getElementById('scansPanel');
        const list = document.getElementById('scansList');
        const uuidDisplay = document.getElementById('scansUuid');

        uuidDisplay.textContent = `UUID: ${tagUuid}`;
        list.innerHTML = '<div class="loading"><div class="spinner" style="width:24px;height:24px;border-width:2px;margin:0 auto;"></div></div>';
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

        try {
          const db = initDB();
          
          const { data, error } = await db
            .from('scans')
            .select('*')
            .eq('nfc_uuid', tagUuid)
            .order('scan_time', { ascending: false });

          if (error) throw error;

          if (!data || data.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-secondary);">Nessuna scansione registrata</div>';
            return;
          }

          list.innerHTML = data.map(scan => {
            const scanDate = new Date(scan.scan_time);
            const formattedTime = scanDate.toLocaleString('it-IT', {
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });
            
            return `
              <div class="scan-item">
                <div class="scan-time">📅 ${formattedTime}</div>
                <div class="scan-meta">👤 Operatore: ${scan.operator_id || 'Non specificato'}</div>
                ${scan.location ? `<div class="scan-meta">📍 ${scan.location}</div>` : ''}
              </div>
            `;
          }).join('');

        } catch (err) {
          console.error('Error loading scans:', err);
          list.innerHTML = `<div style="color:var(--danger);padding:16px;">Errore: ${err.message}</div>`;
        }
      }

      function showError(message) {
        const errorEl = document.getElementById('error');
        errorEl.classList.remove('hidden');
        errorEl.style.display = 'block';
        errorEl.innerHTML = `
          <h3>❌ Errore</h3>
          <p><strong>Dettaglio:</strong> <code>${message}</code></p>
          <button class="retry-btn" onclick="location.reload()" style="margin-top:16px;">🔄 Riprova</button>
        `;
      }

      function showLoginError() {
        const errorEl = document.getElementById('loginError');
        errorEl.classList.add('show');
        setTimeout(() => errorEl.classList.remove('show'), 5000);
      }

      function hideLoginError() {
        document.getElementById('loginError').classList.remove('show');
      }

      function setLoginLoading(loading) {
        const btn = document.getElementById('loginBtn');
        if (loading) {
          btn.disabled = true;
          btn.innerHTML = '<span class="loading-spinner"></span>Verifica...';
        } else {
          btn.disabled = false;
          btn.textContent = 'Accedi';
        }
      }

      // Event Listeners
      document.getElementById('pinForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideLoginError();
        
        const pinInput = document.getElementById('pinInput');
        const pin = pinInput.value.trim().toUpperCase();
        
        // Validate PIN format
        if (!/^[A-Z0-9]{4}$/.test(pin)) {
          pinInput.focus();
          showLoginError();
          document.querySelector('#loginError').textContent = '❌ PIN non valido. Deve contenere 4 caratteri alfanumerici.';
          return;
        }
        
        setLoginLoading(true);
        
        document.getElementById('error').classList.add('hidden');
        document.getElementById('error').style.display = 'none';
        document.getElementById('productsSection').classList.add('hidden');
        document.getElementById('scansPanel').style.display = 'none';
        
        try {
          await loadProductsForPin(pin);
          currentPin = pin;
          
          // Success: hide login, show products
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('productsSection').classList.remove('hidden');
          
        } catch (err) {
          console.error('Login error:', err);
          showLoginError();
          document.querySelector('#loginError').textContent = '❌ PIN non trovato. Controlla e riprova.';
          
          // Ensure everything stays hidden on error
          document.getElementById('productsSection').classList.add('hidden');
          document.getElementById('loginSection').classList.remove('hidden');
          document.getElementById('scansPanel').style.display = 'none';
          document.getElementById('error').classList.add('hidden');
          document.getElementById('error').style.display = 'none';
          
          pinInput.focus();
          pinInput.select();
        } finally {
          setLoginLoading(false);
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        currentPin = null;
        yachtName = null;
        selectedColumnIndex = -1;
        
        // Full reset
        document.getElementById('productsSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('pinInput').value = '';
        document.getElementById('scansPanel').style.display = 'none';
        document.getElementById('error').classList.add('hidden');
        document.getElementById('error').style.display = 'none';
        hideLoginError();
      });

      document.getElementById('closeScansBtn').addEventListener('click', () => {
        document.getElementById('scansPanel').style.display = 'none';
        highlightColumn(-1);
      });

      // Input formatting: auto-uppercase and limit to 4 chars
      document.getElementById('pinInput').addEventListener('input', function(e) {
        this.value = this.value.toUpperCase().slice(0, 4);
      });

      // Allow only alphanumeric
      document.getElementById('pinInput').addEventListener('keypress', function(e) {
        if (!/[A-Za-z0-9]/.test(e.key)) {
          e.preventDefault();
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        console.log('=== Falcord Client Login ===');
        document.getElementById('pinInput').focus();
      });

    })();
  </script>
</body>
</html>
